apiVersion: v1
kind: Service
metadata:
  name: devorbit-service
  namespace: devorbit
  labels:
    app.kubernetes.io/name: devorbit-app
    app.kubernetes.io/part-of: devorbit
spec:
  type: NodePort
  sessionAffinity: ClientIP
  selector:
    app: devorbit-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
