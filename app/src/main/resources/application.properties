# Application Configuration
spring.application.name=devorbit-app
server.port=${SERVER_PORT:8080}

# DevOrbit Application Metadata
# app.version is filtered from the Maven project version at build time (single source of truth).
app.name=DevOrbit Campus Issue Management
app.version=@project.version@
app.environment=${APP_ENVIRONMENT:local}

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.info.env.enabled=true

# Prometheus metrics (scraped by Prometheus and visualised in Grafana)
management.metrics.tags.application=${spring.application.name}

# Exposed build information
info.app.name=${app.name}
info.app.version=@project.version@
info.app.environment=${APP_ENVIRONMENT:local}

# Logging Configuration
logging.level.root=INFO
logging.level.com.devorbit=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
