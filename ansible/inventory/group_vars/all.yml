# Shared Ansible variables for every DevOrbit host.
aws_region: "ap-south-1"
cloudwatch_log_group: "/devorbit/dev/system"
k3s_version: "v1.30.6+k3s1"
system_timezone: "UTC"
ecr_repository_name: "devorbit-app"
k8s_namespace: "devorbit"
k8s_deployment_name: "devorbit-app"
k3s_node_port: "30080"
jenkins_kubeconfig_credential_id: "k8s-kubeconfig"
