---
- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline utilities and Java runtime
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - git
      - htop
      - jq
      - unzip
      - net-tools
      - python3
      - awscli
      - maven
      - openjdk-21-jre-headless
    state: present

- name: Ensure the timezone is UTC
  timezone:
    name: "{{ system_timezone }}"

- name: Disable swap for the current session
  command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
  changed_when: ansible_swaptotal_mb | int > 0

- name: Comment out swap entries in /etc/fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load required kernel modules for Kubernetes networking
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - br_netfilter
    - overlay

- name: Enable IPv4 forwarding and bridge netfilter sysctls
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: net.ipv4.ip_forward, value: "1" }
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
