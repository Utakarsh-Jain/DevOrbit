---
- name: Check if k3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install lightweight k3s Kubernetes distribution
  shell: "curl -sfL https://get.k3s.io | sh -"
  when: not k3s_binary.stat.exists
  args:
    creates: /usr/local/bin/k3s

- name: Ensure k3s service is running and enabled
  systemd:
    name: k3s
    state: started
    enabled: yes

- name: Ensure .kube directory exists for ubuntu user
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'

- name: Copy k3s kubeconfig to ubuntu user home
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Create symlink for kubectl in /usr/local/bin
  file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link
    force: yes
