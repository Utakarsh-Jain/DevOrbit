---
# Installs a single-node k3s cluster on the application host (VPC-B).
# The kubeconfig is rewritten to use the host private IP so the Jenkins host
# in VPC-C can reach the API server over VPC peering.

- name: Check whether k3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install k3s server with a pinned version
  shell: >-
    curl -sfL https://get.k3s.io |
    INSTALL_K3S_VERSION={{ k3s_version }} sh -s - server
    --tls-san {{ ansible_default_ipv4.address }}
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists

- name: Ensure the k3s service is running and enabled
  systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for the k3s kubeconfig to be created
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 60

- name: Read the generated kubeconfig
  slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig

- name: Ensure the .kube directory exists for the ubuntu user
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Publish the kubeconfig for the ubuntu user using the private IP
  copy:
    content: >-
      {{ k3s_kubeconfig.content | b64decode |
         replace('127.0.0.1', ansible_default_ipv4.address) }}
    dest: /home/ubuntu/.kube/config
    owner: ubuntu
    group: ubuntu
    mode: "0600"

- name: Expose kubectl through the k3s binary
  file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link
    force: true

# ECR pull-secret auto-refresh. ECR tokens last 12h; Jenkins only refreshes the
# secret on deploy. Renewing every 6h keeps scale-up and self-healing working
# between deploys, with a 6h margin if one run fails.
- name: Install the ECR pull-secret refresh script
  template:
    src: refresh-ecr-secret.sh.j2
    dest: /usr/local/bin/refresh-ecr-secret.sh
    owner: root
    group: root
    mode: "0700"

- name: Schedule the ECR pull-secret refresh every 6 hours
  cron:
    name: refresh-ecr-secret
    cron_file: refresh-ecr-secret
    user: root
    minute: "0"
    hour: "*/6"
    job: /usr/local/bin/refresh-ecr-secret.sh >> /var/log/refresh-ecr-secret.log 2>&1

- name: Refresh the ECR pull secret now if the namespace exists
  shell: |
    if /usr/local/bin/k3s kubectl get namespace {{ k8s_namespace }} >/dev/null 2>&1; then
      /usr/local/bin/refresh-ecr-secret.sh
    else
      echo "namespace {{ k8s_namespace }} not created yet; Jenkins will create the secret on first deploy"
    fi
  changed_when: false
