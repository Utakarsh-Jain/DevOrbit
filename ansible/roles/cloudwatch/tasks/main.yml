---
# Installs and configures the CloudWatch agent on every DevOrbit host.
# The agent publishes memory, disk and system logs alongside the default
# EC2 CPU and network metrics.

- name: Check whether the CloudWatch agent is already installed
  stat:
    path: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
  register: cw_agent

- name: Download the CloudWatch agent package
  get_url:
    url: "https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb"
    dest: /tmp/amazon-cloudwatch-agent.deb
    mode: "0644"
  when: not cw_agent.stat.exists

- name: Install the CloudWatch agent
  apt:
    deb: /tmp/amazon-cloudwatch-agent.deb
  when: not cw_agent.stat.exists

- name: Render the CloudWatch agent configuration
  template:
    src: config.json.j2
    dest: /opt/aws/amazon-cloudwatch-agent/etc/devorbit-config.json
    mode: "0644"
  register: cw_config

- name: Apply the CloudWatch agent configuration
  command: >-
    /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
    -a fetch-config -m ec2
    -c file:/opt/aws/amazon-cloudwatch-agent/etc/devorbit-config.json -s
  when: cw_config.changed

- name: Ensure the CloudWatch agent service is running and enabled
  systemd:
    name: amazon-cloudwatch-agent
    state: started
    enabled: true
